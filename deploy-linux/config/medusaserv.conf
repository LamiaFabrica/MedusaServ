[Server]
# Server identification
server_name = "MedusaServ Professional"
server_version = "1.0.0"

# Network configuration
listen_address = 0.0.0.0
http_port = 80
https_port = 443

# Worker processes (0 = auto-detect CPU cores)
worker_processes = 0
worker_connections = 1024

[SSL/TLS]
# SSL/TLS Configuration (DISABLED until Let's Encrypt is configured)
ssl_enabled = false
ssl_certificate = /opt/MedusaServ/ssl/certs/server.crt
ssl_certificate_key = /opt/MedusaServ/ssl/keys/server.key
ssl_protocols = TLSv1.2,TLSv1.3
ssl_ciphers = ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
# TODO: Enable after Let's Encrypt certificates are installed

[Database]
# PsiForceDB connection
db_host = localhost
db_port = 5432
db_name = medusaserv
db_user = medusaserv
db_password = CHANGE_ME_PRODUCTION_PASSWORD

# Connection pool
db_pool_min = 5
db_pool_max = 20
db_pool_timeout = 30

[Security]
# SMDU_Root authentication
smdu_root_enabled = true
smdu_root_password = CHANGE_ME_ROOT_PASSWORD

# Session management
session_timeout = 3600
session_secret = CHANGE_ME_SESSION_SECRET

# Rate limiting
rate_limit_enabled = true
rate_limit_requests_per_minute = 100
rate_limit_burst = 20

# DoS protection
dos_protection_enabled = true
max_connections_per_ip = 50

[Logging]
# Log configuration
log_level = INFO
log_file = /opt/MedusaServ/logs/medusaserv.log
error_log = /opt/MedusaServ/logs/error.log
access_log = /opt/MedusaServ/logs/access.log
security_log = /opt/MedusaServ/logs/security.log

# Log rotation
log_rotation = daily
log_retention_days = 30
max_log_size_mb = 100

[Modules]
# Module loading
modules_directory = /opt/MedusaServ/modules
modules_enabled = true
auto_reload_modules = false

[Performance]
# Performance tuning
cache_enabled = true
cache_size_mb = 256
compression_enabled = true
compression_level = 6

# Request timeouts
request_timeout = 60
keepalive_timeout = 75

[License]
# License management
license_mode = FREE
license_key =
patreon_tier = FREE
patreon_webhook_url =

[Portal]
# Web portal configuration
portal_enabled = true
portal_path = /opt/MedusaServ/web/portal
web_root = /opt/MedusaServ/web
lamia_enabled = true
lamia_components_path = /opt/MedusaServ/web/portal/components
default_index = index.lamia
portal_port = 80

[ICEWALL]
# ICEWALL Quantum Security
icewall_enabled = true
pqc_enabled = true
ai_threat_detection = true
self_healing_enabled = true

[PurplePages]
# Purple Pages Error Tracking
purple_pages_enabled = true
purple_pages_retention_days = 90

[VirtualHosts]
# Virtual host configuration directory
vhosts_config_dir = /opt/MedusaServ/config/vhosts
vhosts_enabled = true
